# Copy this file to config.toml and edit. config.toml is gitignored, so your
# copy is never overwritten by an update.
#
# Every value below is already the working setup -- measured line thresholds,
# the adapter's name, the models that tested best, the trade vocabulary. The
# same values are also the built-in defaults, so if config.toml is missing or
# deleted the app behaves identically. Nothing here has to be edited to work;
# change something only when you want it different.
#
# The one thing to revisit if you take this to another phone or another room:
# run `levels.bat` and update the two thresholds under [detect].

[audio]
# Substring matched (case-insensitive) against input device names to find the
# adapter. Run `run.bat devices` to see what yours reports itself as -- most
# telephone adapters do NOT say "LRX" anywhere; they show up under a generic
# name like "Microphone (USB PnP Audio Device)".
#
# Windows lists the same device once per driver stack, so several entries with
# the same name are normal and are handled automatically.
device_match = "USB PnP"

# Escape hatch, for when two genuinely different devices share a name -- a
# phone adapter and a USB headset, say. Set it to one of the numbers from
# `run.bat devices` to pin that exact entry. Leave at -1 to match by name,
# which survives Windows renumbering devices when you plug something in.
device_index = -1

# Leave these alone unless `run.bat doctor` tells you to change them.
sample_rate = 16000

# How the adapter presents the two sides of the call.
#   auto   -- measure it on the first call and decide (recommended)
#   mixed  -- both sides summed into one signal
#   split  -- your voice on one channel, the caller on the other
stereo_mode = "auto"


[detect]
# webrtcvad aggressiveness, 0-3. Higher = more willing to call something
# non-speech. 2 is a good default for telephone-band audio.
vad_aggressiveness = 2

# Continuous speech required before we decide a call has started.
speech_trigger_ms = 300

# ---------------------------------------------------------------------------
# Ending a call. Run `run.bat levels` to get the right numbers for your line
# instead of guessing -- it measures your actual phone and prints them.
#
# There are two thresholds because "nobody is talking" and "the call is over"
# are different things. An open phone line always carries some noise, so when a
# caller goes quiet to look something up, the level drops but does not vanish.
# It only vanishes when the handset goes back on the cradle.
# ---------------------------------------------------------------------------

# Below this level, the line counts as hung up. This is what normally ends a
# call, and it should sit BELOW noise_floor_dbfs. Lower it if calls are ending
# while someone is just thinking.
line_dead_dbfs = -59.0

# How long the line must stay dead before we act on it.
line_dead_s = 3.0

# Fallback: no speech at all for this long ends the call, however loud the line
# is. Only fires on lines that stay noisy after the far end hangs up. It is
# deliberately long -- a short value here is what chops one call into two.
hangup_silence_s = 45.0

# Frames quieter than this are never treated as speech, regardless of what
# the VAD says. Guards against line hiss triggering a recording.
noise_floor_dbfs = -48.0

# Calls shorter than this are discarded as false triggers (line noise, a
# handset knocked off the cradle, a wrong number).
min_call_s = 10.0

# Hard stop, so a recording left running can't go on forever. In manual mode
# this is the backstop for a hotkey that never got pressed a second time.
# Set it above your longest realistic call and no higher.
max_call_s = 1800.0


[control]
# How recording starts and stops.
#
#   auto   -- the app listens to the line and decides for itself. Good in a
#             quiet office. Depends on the phone line being the loudest thing
#             the adapter can hear.
#
#   manual -- nothing is recorded until you press the hotkey, and it keeps
#             recording until you press it again. Use this in a workshop, a
#             shop floor, or any room where background noise would otherwise
#             start recordings that were never calls. This is the default:
#             nothing is captured until you ask for it.
mode = "manual"

# Works from any window, so you never have to leave what you are doing.
# Write it the obvious way: "ctrl+alt+r", "ctrl+shift+space", "f9", "pause".
#
# Fn is NOT available. The Fn key is handled inside the keyboard's own
# firmware and never reaches Windows, so no program can bind it.
#
# "pause" -- the Pause/Break key -- is worth considering if you want one key
# you can hit without looking. Almost nothing else claims it.
hotkey = "f9"

# Two rising tones when recording starts, two falling when it stops -- so you
# can confirm it armed without looking at the screen.
beep = true


[transcribe]
# Which speech engine to use.
#
#   whisper  -- faster-whisper. Downloads its own weights and takes a
#               vocabulary hint. base.en is quick even on an old CPU.
#   parakeet -- NVIDIA Parakeet TDT via sherpa-onnx. Better English accuracy,
#               and it does not invent sentences over silence the way whisper
#               sometimes does -- but it is roughly three times slower than
#               base.en, being eight times the model. Measured here: 26s
#               against 85s on a seven minute call.
#               Run `run.bat models --parakeet` first (~640 MB, one time).
#
# Compare them on a call of your own rather than taking anyone's word:
#     run.bat compare somecall.wav --engines whisper:base.en,parakeet
engine = "whisper"

# Where the parakeet model lives. Blank means models/parakeet next to this file.
parakeet_dir = ""

# CPU threads for parakeet and for speaker labelling. Your core count is a
# sensible starting point; more than that just adds contention.
num_threads = 4

# faster-whisper model. Telephone audio is narrowband, so bigger is not always
# better. small.en is the sweet spot on CPU; use distil-large-v3 on a GPU.
#   tiny.en  base.en  small.en  medium.en  distil-large-v3
model = "base.en"

# Words this trade actually uses, fed to whisper before it listens. It picks
# between similar-sounding words partly on what it expects, so listing your
# vocabulary is usually more effective than a bigger model -- and free.
#
# Put in the terms that get misheard: parts, brands, street names, your own
# business name. Keep it under a couple of hundred words.
#
vocabulary = "torsion spring, cables, rollers, tracks, panels, hoist, pulleys, opener, operator, keypad, drum, bracket, weather seal, chain, rail, trolley, jamb, header, Chamberlain, LiftMaster, Manaras, Hanover Door Systems, Steinbach, Mitchell, Grunthal, Manitoba"

# auto | cpu | cuda
device = "auto"

# int8 is fastest on CPU. Use float16 on a GPU.
compute_type = "int8"

# 1 is fast and usually fine. 5 is slower and slightly more accurate.
beam_size = 1

language = "en"


[diarize]
# Label who is speaking on each line of the transcript.
#
# A handset tap that mixes both sides produces one signal and no idea who said
# what, which is why the person answering the phone kept being recorded as the
# customer. The business name and staff list work around that by giving the
# model context to reason from; this settles it from the audio instead, so the
# transcript arrives already marked SIDE A and SIDE B.
#
# Off by default: it needs a download and adds roughly a minute per call.
#     run.bat models --diarize      (~44 MB, one time)
enabled = false

# Blank means models/diarize-segmentation and models/diarize-embedding.
segmentation_model = ""
embedding_model = ""

# How many people are on the call. Two, for a phone call -- and saying so
# outright removes the part of the problem diarizers are worst at, which is
# working out how many voices there are. Set to -1 to let it decide.
speakers = 2

num_threads = 4

# Speech shorter than this is not a turn, and silence shorter than this does
# not end one. The defaults suit conversation.
min_speech_s = 0.3
min_silence_s = 0.5


[extract]
# Local LLM that turns the raw transcript into work-order fields.
base_url = "http://127.0.0.1:11434"

# Any model from https://ollama.com/library . Worth comparing on your own
# hardware rather than taking anyone's word:
#     run.bat compare somecall.wav --models gemma3:4b,gemma4:e4b
#
#   gemma4:e4b  -- built for edge hardware, and the first Gemma with native
#                  system-role support, which is what carries the "never invent
#                  a value" rules. Try this one first.
#   gemma4:e2b  -- smaller sibling, if e4b is too slow
#   gemma3:4b   -- the previous default; dependable
#   gemma3:1b   -- fastest, weakest at addresses
#   gemma4:12b  -- more accurate, wants ~10 GB RAM and real patience on an
#                  older CPU
model = "gemma4:e4b"

# Reasoning models think before answering. Filling in a fixed schema from a
# transcript needs no reasoning, and on a slow CPU it is minutes of pure cost.
# Leave this off unless you are testing whether it helps. Models with no
# reasoning mode ignore it.
think = false

temperature = 0.0
num_ctx = 8192

# Transcripts longer than this are split into pieces, extracted separately, and
# merged. It is a ceiling on how much text goes in one request, not a speed
# control -- lowering it does NOT make extraction faster. It makes it worse:
# each piece sees only part of the call, so a time or a price agreed near the
# end can be missed or taken from an earlier, superseded mention.
#
# A ten-minute call is roughly 9,000 characters, so most calls never reach
# this. Raise it if you take very long calls; leave it alone otherwise.
chunk_chars = 12000

# How long to let one extraction run before giving up. An eleven-minute call
# takes a capable model several minutes on an older CPU, and this all happens
# in the background, so being generous costs nothing. Too low and a long call
# produces a transcript with no work order attached.
timeout_s = 900


[output]
dir = "output"

# Keep the call audio on disk after transcribing. OFF by default -- audio is
# overwritten and deleted as soon as the transcript exists. Turn this on only
# while you are testing, then turn it back off.
keep_audio = false

show_popup = true
copy_to_clipboard = true
save_transcript = true


[business]
# Printed at the top of the work order, and told to the model so it never
# mistakes your own business for the customer's details.
name = "Hanover Doors Systems"

# Whoever answers the phone, comma-separated. Worth filling in: the transcript
# does not say who is speaking, so without this the model has no way to tell
# "my name is Johan" from a customer introducing themselves -- and it will put
# your own staff member down as the customer.
#
# This is a hint, not a lock. Someone not listed who answers by naming the
# business is still recognised as staff, and a CALLER who happens to share a
# name with someone listed is still recorded as the customer. Listing everyone
# who answers just makes it certain rather than inferred.
#
staff = "Johan, Derek"

# Optional. Helps the model resolve partial addresses like "on Maple, here in
# town" into something a tech can navigate to. Leave blank to disable.
default_service_area = "Steinbach or Mitchell"
