[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "call-transcriber"
version = "0.1.0"
description = "Local phone call transcription and service work-order extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24",
    "soxr>=0.3.7",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.0.3",
    "requests>=2.31",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "Pillow>=10.0"]
dev = ["pytest>=7.4"]

[project.scripts]
call-transcriber = "call_transcriber.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
